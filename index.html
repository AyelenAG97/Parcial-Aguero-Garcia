<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial 1 Ayelen Aguero Garcia</title>
    <link rel='stylesheet' href='https://code.jquery.com/ui/1.11.1/themes/smoothness/jquery-ui.css'>
    <script src='https://code.jquery.com/jquery-1.12.4.js'></script>
    <script src='https://code.jquery.com/ui/1.12.1/jquery-ui.js'></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="page-header">
        <h1>Albums</h1>
        <p>Registry de los albums</p>
    </header>

    <div class="main-layout">

        <aside class="form-card">
            <h2>Albums</h2>
            <form id="albumForm">
                <div class="field">
                    <label for="albumId">Album ID</label>
                    <input type="number" id="albumId" placeholder="Enter an album ID">
                </div>
                <div class="field">
                    <label for="Id">ID</label>
                    <input type="number" id="Id" placeholder="Enter an ID to load">
                </div>
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Enter a title">
                </div>
                <div class="field">
                    <label for="url">URL</label>
                    <input type="text" id="url" placeholder="">
                </div>
                <div class="field">
                    <label for="thumbnailUrl">Thumbnail URL</label>
                    <input type="text" id="thumbnailUrl" placeholder="">
                </div>
            </form>

            <div class="btn-group">
                <button class="btn btn-primary"   type="button" onclick="addAlbum()">Add album</button>
                <button class="btn btn-secondary" type="button" onclick="updateAlbum()">Update album</button>
                <button class="btn btn-danger"    type="button" onclick="deleteAlbum()">Delete album</button>
            </div>
        </aside>

        <section class="table-section">
            <h2>Registry albums</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Album ID</th>
                            <th>Title</th>
                            <th>URL</th>
                            <th>Thumbnail URL</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" class="empty-state">cargando albums…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        const ENDPOINT = 'https://jsonplaceholder.typicode.com/photos'
        let apiResponse = null;

        function xmlFetchData() {
            const xhr = new XMLHttpRequest();
            xhr.responseType = 'json';
            xhr.onreadystatechange = function () {
                // Fix 1: & -> &&
                if (xhr.readyState === 4 && xhr.status === 200) {
                    // Fix 2: xhr.repsonse -> xhr.response
                    const data = xhr.response;
                    console.log(data);
                    apiResponse = data;
                    createTable(apiResponse);
                }
            };
            xhr.onerror = function () {
                console.log("Error al cargar");
                return;
            };
            xhr.open('GET', ENDPOINT, true);
            xhr.send();
        }

        xmlFetchData();

        function createTable(apiResponse) {
            console.log(apiResponse);
            // Fix 3: getElementaryById -> getElementById
            const tableBody = document.getElementById("tableBody");
            // Fix 4: innerHtml -> innerHTML
            tableBody.innerHTML = "";

            if (!apiResponse || apiResponse.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="empty-state">No albums registered yet.</td></tr>';
                return;
            }

            apiResponse.forEach(photo => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${photo.id}</td>
                    <td>${photo.albumId}</td>
                    <td class="title-cell">${photo.title}</td>
                    <td>${photo.url}</td>
                    <td>${photo.thumbnailUrl}</td>
                `;

                row.querySelector('.title-cell').addEventListener('click', function () {
                    row.classList.toggle('expanded');
                });

                // Fix 5: appenchild -> appendChild
                tableBody.appendChild(row);
            });
        }

        // Autocompleta el formulario al escribir un ID
        document.getElementById('Id').addEventListener('input', function () {
            const idValue = this.value;
            const existingAlbum = apiResponse ? apiResponse.find(p => String(p.id) === String(idValue)) : null;
            if (existingAlbum) {
                document.getElementById('albumId').value = existingAlbum.albumId || '';
                document.getElementById('title').value = existingAlbum.title || '';
                document.getElementById('url').value = existingAlbum.url || '';
                document.getElementById('thumbnailUrl').value = existingAlbum.thumbnailUrl || '';
            } else {
                document.getElementById('albumId').value = '';
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                document.getElementById('thumbnailUrl').value = '';
            }
        });

        // Fix 6: addAlbum, updateAlbum, deleteAlbum definidas fuera de createTable
        // Fix 11: renombradas de addPhoto/updatePhoto/deletePhoto a addAlbum/updateAlbum/deleteAlbum
        function addAlbum() {
            const albumId = document.getElementById('albumId').value;
            // Fix 12: id="tittle" corregido a id="title" en el HTML
            const title = document.getElementById('title').value;
            const url = document.getElementById('url').value;
            const thumbnailUrl = document.getElementById('thumbnailUrl').value;

            const newAlbum = {
                albumId,
                title,
                url,
                thumbnailUrl
            };

            const xhr = new XMLHttpRequest();
            xhr.open('POST', ENDPOINT, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 201)) {
                    console.log("Album added successfully");
                    xmlFetchData();
                    // Fix 9: "photo Form" con espacio -> "albumForm"
                    document.getElementById('albumForm').reset();
                }
            };
            xhr.send(JSON.stringify(newAlbum));
        }

        function updateAlbum() {
            const id = document.getElementById('Id').value;
            if (!id) {
                alert("Please select an album ID");
                return;
            }
            const album = apiResponse ? apiResponse.find(p => String(p.id) === String(id)) : null;
            if (!album) {
                alert("Album not found");
                return;
            }

            const albumId = document.getElementById('albumId').value;
            const title = document.getElementById('title').value;
            const url = document.getElementById('url').value;
            const thumbnailUrl = document.getElementById('thumbnailUrl').value;

            const updatedAlbum = {
                albumId,
                title,
                url,
                thumbnailUrl
            };

            const xhr = new XMLHttpRequest();
            xhr.open('PUT', `${ENDPOINT}/${id}`, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status >= 200 && xhr.status < 300) {
                    console.log("Album updated successfully");
                    xmlFetchData();
                }
            };
            xhr.send(JSON.stringify(updatedAlbum));
        }

        function deleteAlbum() {
            const id = document.getElementById('Id').value;
            if (!id) {
                alert("Please select an album ID");
                return;
            }
            const album = apiResponse ? apiResponse.find(p => String(p.id) === String(id)) : null;
            if (!album) {
                alert("Album not found");
                return;
            }

            const xhr = new XMLHttpRequest();
            xhr.open('DELETE', `${ENDPOINT}/${id}`, true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 204)) {
                    console.log("Album deleted successfully");
                    xmlFetchData();
                    document.getElementById('albumForm').reset();
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
